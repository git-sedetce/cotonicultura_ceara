<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
      <section class="card shadow-sm">
        <div class="card-header bg-success text-white">
          <h1 class="h4 mb-0">Redefinir senha do produtor</h1>
        </div>
        <div class="card-body">
          <p>Crie uma senha nova para concluir a ativação do seu cadastro.</p>
          <form #formReset="ngForm" (ngSubmit)="resetarSenha()">
            <div class="mb-3">
              <label for="novaSenhaProdutor" class="form-label">Nova senha</label>
              <input id="novaSenhaProdutor" name="senha" type="password" class="form-control"
                [(ngModel)]="senha" minlength="8" autocomplete="new-password" required>
              <small class="form-text text-muted">A senha deve ter pelo menos 8 caracteres.</small>
            </div>
            <div class="mb-3">
              <label for="confirmarSenhaProdutor" class="form-label">Confirme a nova senha</label>
              <input id="confirmarSenhaProdutor" name="confirmarSenha" type="password" class="form-control"
                [(ngModel)]="confirmarSenha" autocomplete="new-password" required>
              <div *ngIf="confirmarSenha && senha !== confirmarSenha" class="text-danger small mt-1">
                As senhas não conferem.
              </div>
            </div>
            <button type="submit" class="btn btn-success w-100"
              [disabled]="formReset.invalid || senha !== confirmarSenha || salvando">
              {{ salvando ? 'Salvando...' : 'Salvar nova senha' }}
            </button>
          </form>
        </div>
      </section>
    </div>
  </div>
</main>
